name: Update daily Chacalon context

on:
  schedule:
    # 08:00 in Peru (UTC-5). Run manually from the Actions tab too.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update context file
        run: node scripts/update-context.js

      - name: Commit context when it changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/context.json
          if git diff --cached --quiet; then
            echo "No context changes to commit."
          else
            git commit -m "chore: update daily Chacalon context"
            git push
          fi
