name: Update hourly Chacalon context

on:
  # La actualización automática se habilitará después de separar los datos
  # del código. Mientras tanto, se ejecuta manualmente para no modificar main.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update context file
        run: node scripts/update-context.js

      - name: Commit context when it changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/context.json
          if git diff --cached --quiet; then
            echo "No context changes to commit."
          else
            git commit -m "chore: update hourly Chacalon context"
            git push
          fi
