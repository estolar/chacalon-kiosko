name: Update hourly Chacalon context

on:
  schedule:
    # Every hour. GitHub Actions may start scheduled jobs a few minutes late.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update context file
        run: node scripts/update-context.js

      - name: Commit context when it changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/context.json
          if git diff --cached --quiet; then
            echo "No context changes to commit."
          else
            git commit -m "chore: update hourly Chacalon context"
            git push
          fi
